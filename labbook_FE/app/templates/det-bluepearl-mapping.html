{% extends "skeleton.html" %}

{% block head %}
{{ super() }}
<title>{{ _("Détail Mapping BluePearl") }}</title>
{% endblock %}

{% block content %}
<div id="content">
    <div class="inner">
        <div id="main">
            <h2 class="page-title page-title-color"><span>{{ _("Détail Mapping BluePearl") }}</span></h2>

            <form autocomplete="off">
                <div class="row">
                    <!-- Colonne gauche: BPHT -->
                    <div class="col-md-6 border-end">
                        <h4 class="mb-3 text-secondary">{{ _("Configuration Automate (BPHT)") }}</h4>

                        <div class="form-group mb-3">
                            <label for="bpm_machinename" class="form-label fw-bold">{{ _("Nom de la machine
                                (Optionnel)") }}</label>
                            <input type="text" id="bpm_machinename"
                                value="{{ args['mapping']['bpm_machinename'] if args['mapping'] else '' }}"
                                class="form-control form-lbk" placeholder="Ex: E411_Faridabad">
                        </div>

                        <div class="form-group mb-3">
                            <label for="bpm_test_id" class="form-label fw-bold">{{ _("ID du Test *") }}</label>
                            <input type="number" id="bpm_test_id"
                                value="{{ args['mapping']['bpm_test_id'] if args['mapping'] else '' }}"
                                class="form-control form-lbk" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="bpm_test_name" class="form-label fw-bold">{{ _("Nom du Test") }}</label>
                            <input type="text" id="bpm_test_name"
                                value="{{ args['mapping']['bpm_test_name'] if args['mapping'] else '' }}"
                                class="form-control form-lbk">
                        </div>

                        <div class="form-group mb-3">
                            <label for="bpm_param_id" class="form-label fw-bold">{{ _("ID du Paramètre *") }}</label>
                            <input type="number" id="bpm_param_id"
                                value="{{ args['mapping']['bpm_param_id'] if args['mapping'] else '' }}"
                                class="form-control form-lbk" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="bpm_param_name" class="form-label fw-bold">{{ _("Nom du Paramètre") }}</label>
                            <input type="text" id="bpm_param_name"
                                value="{{ args['mapping']['bpm_param_name'] if args['mapping'] else '' }}"
                                class="form-control form-lbk">
                        </div>
                    </div>

                    <!-- Colonne droite: LabBook -->
                    <div class="col-md-6">
                        <h4 class="mb-3 text-secondary">{{ _("Correspondance LabBook") }}</h4>

                        <div class="form-group mb-3">
                            <label for="bpm_ana_id" class="form-label fw-bold">{{ _("Analyse *") }}</label>
                            <select id="bpm_ana_id" class="form-select form-lbk" onchange="load_variables();" required>
                                <option value="">{{ _("Chargement des analyses...") }}</option>
                            </select>
                            <input type="hidden" id="bpm_ana_code"
                                value="{{ args['mapping']['bpm_ana_code'] if args['mapping'] else '' }}">
                        </div>

                        <div class="form-group mb-3">
                            <label for="bpm_var_id" class="form-label fw-bold">{{ _("Variable *") }}</label>
                            <select id="bpm_var_id" class="form-select form-lbk" required onchange="update_var_code();">
                                <option value="">{{ _("Sélectionnez d'abord une analyse") }}</option>
                            </select>
                            <input type="hidden" id="bpm_var_code"
                                value="{{ args['mapping']['bpm_var_code'] if args['mapping'] else '' }}">
                        </div>
                    </div>
                </div>

            </form>

            <div class="my-3 clearfix">
                <div class="float-start ms-0">
                    <input type="button" onclick="cancel();" id="btn_cancel" value="{{ _(" Annuler") }}"
                        class="btn btn-lbk btn-{{ session['user_role']|safe }}">
                </div>
                <div class="float-end">
                    <input type="button" onclick="save_item();" id="btn_save" value="{{ _(" Enregistrer") }}"
                        class="btn btn-lbk btn-{{ session['user_role']|safe }} ms-2">
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block add_script %}
<script type="text/javascript" nonce="{{ session['nonce'] }}">

    var mapping_id = {% if args['mapping'] and args['mapping']['bpm_ser'] %}{ { args['mapping']['bpm_ser'] } } {% else %} 0{% endif %};
    var current_ana_id = {% if args['mapping'] and args['mapping']['bpm_ana_id'] %}{ { args['mapping']['bpm_ana_id'] } } {% else %} 0{% endif %};
    var current_var_id = {% if args['mapping'] and args['mapping']['bpm_var_id'] %}{ { args['mapping']['bpm_var_id'] } } {% else %} 0{% endif %};

    function load_analyses() {
        $.ajax({
            url: "{{ session['server_int'] }}/{{ session['redirect_name'] }}/services/analysis/list/active",
            type: "GET",
            dataType: "json",
            headers: { 'Authorization': 'Bearer {{ session.get("be_access_token","") }}' },
            success: function (response) {
                var options = '<option value="">{{ _("Sélectionnez une analyse") }}</option>';
                if (response) {
                    for (var i = 0; i < response.length; i++) {
                        var sel = (response[i].id_data == current_ana_id) ? "selected" : "";
                        options += '<option value="' + response[i].id_data + '" data-code="' + response[i].code + '" ' + sel + '>' + response[i].nom + ' (' + response[i].code + ')</option>';
                    }
                }
                $("#bpm_ana_id").html(options);
                if (current_ana_id > 0) {
                    load_variables();
                }
            },
            error: function (xhr) {
                $("#bpm_ana_id").html('<option value="">{{ _("Erreur de chargement") }}</option>');
            }
        });
    }

    function load_variables() {
        var ana_id = $("#bpm_ana_id").val();
        if (!ana_id) {
            $("#bpm_var_id").html('<option value="">{{ _("Sélectionnez d\'abord une analyse") }}</option>');
            return;
        }

        var ana_code = $("#bpm_ana_id").find(':selected').data('code');
        $("#bpm_ana_code").val(ana_code);

        $.ajax({
            url: "{{ session['server_int'] }}/{{ session['redirect_name'] }}/services/analysis/det/" + ana_id,
            type: "GET",
            dataType: "json",
            headers: { 'Authorization': 'Bearer {{ session.get("be_access_token","") }}' },
            success: function (response) {
                var options = '<option value="">{{ _("Sélectionnez une variable") }}</option>';
                if (response && response.variables) {
                    for (var i = 0; i < response.variables.length; i++) {
                        var v = response.variables[i];
                        var sel = (v.id_data == current_var_id) ? "selected" : "";
                        options += '<option value="' + v.id_data + '" data-code="' + v.code_var + '" ' + sel + '>' + v.libelle + ' (' + v.code_var + ')</option>';
                    }
                }
                $("#bpm_var_id").html(options);
            },
            error: function (xhr) {
                $("#bpm_var_id").html('<option value="">{{ _("Erreur de chargement") }}</option>');
            }
        });
    }

    function update_var_code() {
        var var_code = $("#bpm_var_id").find(':selected').data('code');
        $("#bpm_var_code").val(var_code);
    }

    function save_item() {
        var machinename = $("#bpm_machinename").val().trim();
        var test_id = $("#bpm_test_id").val().trim();
        var test_name = $("#bpm_test_name").val().trim();
        var param_id = $("#bpm_param_id").val().trim();
        var param_name = $("#bpm_param_name").val().trim();
        var ana_id = $("#bpm_ana_id").val();
        var var_id = $("#bpm_var_id").val();
        var ana_code = $("#bpm_ana_code").val();
        var var_code = $("#bpm_var_code").val();

        var msg = "";

        if (test_id == "" || param_id == "")
            msg += "{{ _("Veuillez saisir un ID de test et un ID de paramètre.") }}\n";

        if (ana_id == "" || var_id == "")
            msg += "{{ _("Veuillez sélectionner une analyse et une variable correspondantes.") }}";

        if (msg != "") {
            alert(msg);
            return false;
        }

        var param = JSON.stringify({
            "bpm_machinename": machinename,
            "bpm_test_id": parseInt(test_id),
            "bpm_test_name": test_name,
            "bpm_param_id": parseInt(param_id),
            "bpm_param_name": param_name,
            "bpm_ana_id": parseInt(ana_id),
            "bpm_var_id": parseInt(var_id),
            "bpm_ana_code": ana_code,
            "bpm_var_code": var_code
        });

        // popup wait
        $("#dial-wait").off('shown.bs.modal');
        $("#dial-wait").modal("show");

        var method = (mapping_id > 0) ? "PUT" : "POST";
        var url = "{{ session['server_int'] }}/{{ session['redirect_name'] }}/services/external/bluepearl/mapping";
        if (mapping_id > 0) {
            url += "/" + mapping_id;
        }

        $.ajax({
            type: method,
            url: url,
            dataType: 'json',
            contentType: "application/json; charset=utf-8",
            data: param,
            headers: { 'Authorization': 'Bearer {{ session.get("be_access_token","") }}' },
            success: function (data) {
                window.location = "{{ session['server_ext'] }}/list-bluepearl-mapping";
            },
            error: function (data) {
                console.log("ERROR POST/PUT mapping");
                $("#dial-wait").modal("hide");
                if (data.responseJSON && data.responseJSON.error) {
                    alert("{{ _("Erreur: ") }}" + data.responseJSON.error);
                } else {
                    alert("{{ _("Une erreur est survenue lors de l'enregistrement") }}") ;
           }
            }
        });
    }

    function cancel() {
        window.location.href = "{{ session['server_ext'] }}/list-bluepearl-mapping";
    }

    $(document).ready(function () {
        load_analyses();
    });

</script>
{% endblock %}
